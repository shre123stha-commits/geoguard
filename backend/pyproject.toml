[project]
name = "geoguard-eo-backend"
version = "1.1.0"
description = "GeoGuard-EO backend: FastAPI API, scan worker, and detection pipeline"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0,<2.1",
  "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
# Phase 1+ geospatial stack. Installed separately so Phase 0 works even if
# rasterio/GDAL wheels are troublesome on Windows (see 08-rules.md §12).
geo = [
  "geoalchemy2>=0.15",
  "alembic>=1.13",
  "rasterio>=1.3",
  "numpy>=1.26",
  "shapely>=2.0",
  "geopandas>=0.14",
  "pyproj>=3.6",
  "scipy>=1.13",
  "scikit-image>=0.23",
  "pystac-client>=0.8",
  "planetary-computer>=1.0",
  "apscheduler>=3.10,<4",
  "reportlab>=4.1",
  "argon2-cffi>=23.1",
  "pyjwt>=2.8",
  "pillow>=10.0",
  "python-multipart>=0.0.9",
]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
  "ruff>=0.5",
  "mypy>=1.10",
  "pre-commit>=3.7",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W", "T20"]  # T20 forbids print()

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["T20"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app"]
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff.lint.isort]
known-first-party = ["app"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
